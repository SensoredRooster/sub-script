name: Deploy Cloudflare Support Collector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-support-worker.yml"
      - "cloudflare/support-worker/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Normalize Cloudflare token
        shell: bash
        env:
          RAW_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_KEY || vars.CLOUDFLARE_API_KEY || secrets.CF_API_TOKEN || vars.CF_API_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$RAW_CLOUDFLARE_TOKEN" | tr -d '\r\n')"
          TOKEN="$(printf '%s' "$TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          TOKEN="${TOKEN#Bearer }"
          TOKEN="${TOKEN#bearer }"
          TOKEN="${TOKEN#\"}"
          TOKEN="${TOKEN%\"}"
          TOKEN="${TOKEN#\'}"
          TOKEN="${TOKEN%\'}"
          if [ -z "$TOKEN" ]; then
            echo "Cloudflare API token is empty after normalization."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Ensure R2 bucket exists
        working-directory: cloudflare/support-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: 9c5f81e73d237bab60bdb0bc2085cd56
        run: wrangler r2 bucket create subscript-support-logs || true
      - name: Set upload secret
        working-directory: cloudflare/support-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: 9c5f81e73d237bab60bdb0bc2085cd56
          SUPPORT_ADMIN_TOKEN: ${{ secrets.SUBSCRIPT_SUPPORT_ADMIN_TOKEN }}
        run: |
          if [ -n "$SUPPORT_ADMIN_TOKEN" ]; then
            printf "%s" "$SUPPORT_ADMIN_TOKEN" | wrangler secret put SUPPORT_ADMIN_TOKEN
          else
            echo "Admin retrieval secret not configured; uploads will still work and bundles remain accessible from the R2 dashboard."
          fi
      - name: Deploy Worker
        working-directory: cloudflare/support-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: 9c5f81e73d237bab60bdb0bc2085cd56
        run: wrangler deploy
