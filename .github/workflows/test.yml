name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        shell: powershell
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff, advisory)
        shell: powershell
        continue-on-error: true
        run: |
          pip install ruff
          ruff check subscript tests --output-format=github --exit-zero

      - name: Compile Python
        shell: powershell
        run: python -m compileall -q subscript

      - name: Run tests
        shell: powershell
        run: pytest -q
