hotkey: "ctrl+shift+c"
buffer_seconds: 30

stream:
  resolution: "1920x1080"
  player_name: "YourActivisionId"

brand:
  logo_path: "assets/logo.png"
  opacity: 0.85
  position: "bottom_right"
  margin_px: 24
  text: "SUB"
  text_size: 24

captions:
  # When true (default), burn demo "Clip · SUB" SRT onto vertical after reframe.
  # No Whisper / ML — reliable ffmpeg burn for Windows py3.14.
  enabled: true

output:
  dir: "out"
  shorts_width: 1080
  shorts_height: 1920
  landscape_width: 1920
  landscape_height: 1080
  reframe: true

review:
  host: "127.0.0.1"
  port: 8787
  require_approval: true

youtube:
  enabled: false
  privacy: "private"
  title_template: "Highlight {timestamp}"
  description: "Clipped with sub-script"
  category_id: "20"
  tags:
    - "Warzone"
    - "Call of Duty"
    - "highlights"
