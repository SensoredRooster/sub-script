hotkey: "ctrl+shift+c"
buffer_seconds: 30

# Live hotkey: rolling source for Ctrl+Shift+C (OBS replay buffer).
# Prefer live_source (exact file) OR watch_folder (newest video by mtime).
live_source: ""
watch_folder: ""
# After hotkey: always run clip → brand → H+V → captions and enqueue for review.
auto_enqueue: true
# Windows toast when possible; otherwise console beep / print.
notify: true

stream:
  resolution: "1920x1080"
  player_name: "YourActivisionId"

brand:
  logo_path: "assets/logo.png"
  opacity: 0.85
  position: "bottom_right"
  margin_px: 24
  text: "SUB"
  text_size: 24

captions:
  # When true (default), burn SRT onto vertical after reframe (+ optional music).
  enabled: true
  # auto = faster-whisper if installed, else demo SRT
  # demo = always placeholder "Clip | SUB"
  # whisper = prefer STT; fail-soft to demo if missing/errors
  # Optional STT: pip install -r requirements-whisper.txt
  engine: auto

music:
  # Mix a quiet bed under horizontal + vertical when the file exists.
  # Default volume is low so game audio stays clear (clamped ~0.01–0.35).
  enabled: true
  path: "assets/music.mp3"
  volume: 0.10

output:
  dir: "out"
  shorts_width: 1080
  shorts_height: 1920
  landscape_width: 1920
  landscape_height: 1080
  reframe: true

review:
  host: "127.0.0.1"
  port: 8787
  require_approval: true

youtube:
  # Keep false for local testing (Approve only builds out/approved pack).
  # Set true after Connect YouTube steps in the README.
  enabled: false
  # private | unlisted | public
  privacy: "unlisted"
  # OAuth Desktop client JSON from Google Cloud (or set YOUTUBE_CLIENT_SECRETS).
  client_secrets_file: "credentials.json"
  # Saved after first browser login (gitignored). Or set YOUTUBE_TOKEN.
  token_file: "token.json"
  title_template: "Highlight {timestamp}"
  description: "Clipped with sub-script"
  category_id: "20"
  tags:
    - "Warzone"
    - "Call of Duty"
    - "highlights"

# ---------------------------------------------------------------------------
# Multi-platform Approve fan-out (subscript/publish/)
# YouTube is the only live API by default. Flip enabled: true on others for
# real for_<platform>/ packs + POST_INSTRUCTIONS.txt (or mode: api later).
# Either platforms.youtube.enabled or youtube.enabled turns on live Shorts upload.
# ---------------------------------------------------------------------------
platforms:
  youtube:
    # Live Shorts upload via OAuth (uses youtube: block above). Default off.
    enabled: false
  tiktok:
    enabled: false
    mode: manual  # manual | api (api raises NotConfiguredError until wired)
  instagram:
    enabled: false
    mode: manual
  facebook:
    enabled: false
    mode: manual
  twitter:
    enabled: false
    mode: manual
  rumble:
    enabled: false
    mode: manual
